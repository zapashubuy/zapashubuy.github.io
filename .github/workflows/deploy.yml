name: Deploy ZapasHub to GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download site bundle
        run: |
          mkdir public
          curl -fL https://github.com/zapashubuy/zapashubuy.github.io/releases/latest/download/ZapasHub_GitHubPages.zip -o /tmp/zapashub.zip
          unzip -q /tmp/zapashub.zip -d public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
